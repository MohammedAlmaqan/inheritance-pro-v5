name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5     # Updated to v5 for Node.js 24 support

      - name: Setup Node.js
        uses: actions/setup-node@v5   # Updated to v5 for Node.js 24 support
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web app
        run: pnpm build

      - name: Setup Java 17
        uses: actions/setup-java@v5   # Updated to v5 for Node.js 24 support
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4   # Updated to v4 for Node.js 24 support
        with:
          packages: 'platforms;android-33 build-tools;33.0.0'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk